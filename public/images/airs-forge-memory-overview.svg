    <text x="120" y="508" font-size="14" letter-spacing="2" opacity=".64">INFORMATION</text>
    <text x="120" y="539" font-size="23">Tools · activity</text>
    <text x="1124" y="408" font-size="14" letter-spacing="2" opacity=".64">FOR APPLICATIONS</text>
